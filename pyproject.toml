[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "gendep-genopred-remission"
version = "1.0.0rc6"
description = "Reproducible workflow for Bayesian polygenic scores and antidepressant remission prediction in GENDEP."
readme = "README.md"
authors = [
  { name = "Anisa Goodaad" },
]
license = { file = "LICENSE.md" }
requires-python = ">=3.11"
keywords = [
  "bioinformatics",
  "pharmacogenomics",
  "polygenic scores",
  "nested cross-validation",
]
dependencies = [
  "matplotlib==3.10.8",
  "numba==0.65.1",
  "numpy==2.3.5",
  "openpyxl==3.1.5",
  "pandas==2.2.3",
  "PyYAML==6.0.3",
  "scipy==1.17.0",
]

[project.urls]
Repository = "https://github.com/goodaadanisa/gendep-genopred-remission"
Documentation = "https://github.com/goodaadanisa/gendep-genopred-remission/tree/main/docs"

[project.scripts]
gendep = "gendep.cli:main"

[project.optional-dependencies]
test = ["pytest>=8.3"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
